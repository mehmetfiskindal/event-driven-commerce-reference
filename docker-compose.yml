services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiecommerce-api
    command: npm run start:dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fiecommerce
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_ORDER_EVENTS_EXCHANGE: order-events
      RABBITMQ_PAYMENT_QUEUE: payment-queue
      RABBITMQ_INVENTORY_QUEUE: inventory-queue
      RABBITMQ_NOTIFICATION_QUEUE: notification-queue
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: fiecommerce-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: fiecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fiecommerce']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiecommerce-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
